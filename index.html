<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ A Little Surprise ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff6b9a,#ff8fb8,#ffd6e7);
    overflow:hidden;
}

.card{
    background:white;
    width:90%;
    max-width:420px;
    padding:30px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.2);
    position:relative;
    z-index:2;
}

h2{
    color:#ff2d55;
    margin-bottom:15px;
}

p{
    margin:15px 0;
    font-size:18px;
    line-height:1.6;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:30px;
    background:#ff2d55;
    color:white;
    font-size:18px;
    cursor:pointer;
    margin:10px;
    transition:.3s;
}

button:hover{
    transform:scale(1.05);
}

#noBtn{
    position:relative;
}

input[type=range]{
    width:100%;
    margin-top:20px;
}

#score{
    font-size:22px;
    color:#ff2d55;
    font-weight:bold;
    margin-top:10px;
}

.heart{
    position:absolute;
    color:#ff4d88;
    animation:float 10s linear infinite;
    font-size:25px;
    opacity:.7;
}

@keyframes float{
    0%{
        transform:translateY(100vh);
    }
    100%{
        transform:translateY(-120vh);
    }
}
</style>
</head>

<body>

<!-- Background Music -->
<audio id="bgMusic" loop>
    <source src="caller-tune-clip.mp3.mp3" type="audio/mpeg">
</audio>

<div id="hearts"></div>

<div class="card" id="card">

<h2>❤️ Hey Handsome ❤️</h2>

<p>I have a tiny love quiz just for you 🥰</p>

<button onclick="q1()">Start ❤️</button>

</div>

<script>

// ==========================
// Background Music
// ==========================
const bgMusic = document.getElementById("bgMusic");

function playMusic(){
    bgMusic.volume = 0.5;
    bgMusic.play().catch(function(error){
        console.log("Music couldn't autoplay:", error);
    });
}

// ==========================
// Floating Hearts
// ==========================
for(let i=0;i<30;i++){

    let h=document.createElement("div");

    h.className="heart";
    h.innerHTML="❤️";

    h.style.left=Math.random()*100+"vw";
    h.style.animationDuration=(6+Math.random()*6)+"s";
    h.style.fontSize=(15+Math.random()*20)+"px";

    document.body.appendChild(h);
}

const card=document.getElementById("card");

// ==========================
// Question 1
// ==========================
function q1(){

    playMusic();

    card.innerHTML=`

    <h2>Question 1 ❤️</h2>

    <p>Will you always be my boyfriend? 🥺</p>

    <button onclick="q2()">YES ❤️</button>

    <button id="noBtn">NO</button>

    `;

    moveNo();

}

// ==========================
// Question 2
// ==========================
function q2(){

card.innerHTML=`

<h2>Question 2 ❤️</h2>

<p>How much do you love me? 🥰</p>

<input type="range" min="0" max="100" value="50" id="love">

<div id="score">50%</div>

<div id="warning" style="color:#ff2d55;margin-top:15px;"></div>

<button onclick="checkLove()">Next ❤️</button>

`;

let slider=document.getElementById("love");

slider.oninput=function(){

document.getElementById("score").innerHTML=this.value+"% ❤️";

}

}

// ==========================
// Check Slider
// ==========================
function checkLove(){

let value=document.getElementById("love").value;

if(value<100){

document.getElementById("warning").innerHTML=
"🥺 Hmm... I think you love me even more! Please move it to 100% ❤️";

return;

}

q3();

}

// ==========================
// Question 3
// ==========================
function q3(){

card.innerHTML=`

<h2>Question 3 ❤️</h2>

<p>Will you always make time for me? 🥹</p>

<button onclick="finish()">YES ❤️</button>

<button id="noBtn">NO</button>

`;

moveNo();

}

// ==========================
// Final Message
// ==========================
function finish(){

card.innerHTML=`

<h2>💖 You Passed! 💖</h2>

<h1>100% Perfect Boyfriend ❤️</h1>

<p>

I just wanted to tell you something... 🥹❤️

<br><br>

I really, really like you.

Every day I secretly wait for your message,
and whenever your name appears on my phone,
it instantly makes me smile. 😊❤️

<br><br>

I always look forward to your calls because hearing your voice makes my whole day better.

<br><br>

Thank you for being such a special part of my life.

I hope we keep making beautiful memories together.

<br><br>

❤️ You're my favourite notification. ❤️

<br><br>

Love you endlessly... 🥰💖

</p>

`;

}

// ==========================
// Moving NO Button
// ==========================
function moveNo(){

const no=document.getElementById("noBtn");

no.addEventListener("mouseover",()=>{

no.style.position="absolute";

no.style.left=Math.random()*250+"px";

no.style.top=Math.random()*220+"px";

});

}

</script>

</body>
</html>
